[project]
name = "declareprotocol"
version = "1.0.2"
description = "Protocol declarations as behavioral contracts"
readme = "README.md"
authors = [
    { name = "Jim Fulton", email = "jim@j1m.dev" },
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=5",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
python_files = [
    "*_test.py",
    "test_*.py",
]
addopts = [
    "--cov=declareprotocol",
    "--cov-report=term-missing",
    "--cov-fail-under=50",
]

[tool.ruff.lint.per-file-ignores]
"**/*_test.py" = ["D"]
"**/test_*.py" = ["D"]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
build_command = "uv build --no-sources"
