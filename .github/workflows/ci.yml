name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
    - name: Validate PR title
      uses: amannn/action-semantic-pull-request@e5f33630df4d7046c399196936cb167905ee0f59 # v5.5.3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install uv
      uses: astral-sh/setup-uv@f599393d9893d20de858ad9b309613c4c849e623 # v5.3.0
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@42eb8f2117218a53f1e8257521dd3cf57fc1090f # v5.3.0
      with:
        python-version-file: .python-version

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run Ruff Check
      run: uv run ruff check src

    - name: Run Ruff Format
      run: uv run ruff format --check src

    - name: Run tests with coverage
      run: uv run python -m pytest
