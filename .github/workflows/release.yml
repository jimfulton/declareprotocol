name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Semantic Release and Publish
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write # Required for Trusted Publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/declareprotocol

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.ref_name }}
        # If your main branch is protected by a ruleset, configure a Personal Access Token
        # (PAT) with write access as RELEASE_TOKEN to bypass branch protection.
        token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0 # Full history is required for python-semantic-release

    - name: Install uv
      uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: .python-version

    - name: Run semantic release version
      run: |
        # Set up git user for semantic-release commits
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Determine next version, update files, commit, tag, and build package
        uv run --with python-semantic-release semantic-release version
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Publish package distributions to PyPI
      if: hashFiles('dist/*') != ''
      uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
      with:
        packages-dir: dist
        print-hash: true
        verbose: true
