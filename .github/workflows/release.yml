name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install uv
      uses: astral-sh/setup-uv@f599393d9893d20de858ad9b309613c4c849e623 # v5.3.0
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@42eb8f2117218a53f1e8257521dd3cf57fc1090f # v5.3.0
      with:
        python-version-file: .python-version

    - name: Build package
      run: uv build --no-sources

    - name: Store distribution artifacts
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/declareprotocol
    permissions:
      id-token: write # Required for Trusted Publishing (OIDC)

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@ccea082c16b740f1b682098b17de62e91a561d02 # v4.1.7
      with:
        name: dist
        path: dist/

    - name: Install uv
      uses: astral-sh/setup-uv@f599393d9893d20de858ad9b309613c4c849e623 # v5.3.0

    - name: Publish package to PyPI
      run: uv publish
